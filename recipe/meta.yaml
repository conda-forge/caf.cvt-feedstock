{% set version = "0.2.0" %}
{% set python_min = "3.11" %}

package:
  name: caf.cvt
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/c/caf.cvt/caf_cvt-{{ version }}.tar.gz
  sha256: de270fc1638ba8512ef53bb476cdd00b12207c6e03d5e43a09d874c5ad57b7db

build:
  entry_points:
    - caf.cvt = caf.cvt.__main__:_main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64.0.0
    - versioningit
    - pip
  run:
    - python >={{ python_min }}
    - caf.toolkit >=0.12.0
    - fiona >=1.10.1
    - geopandas >=1.1.1
    - h5py >=3.15.1
    - numpy >=2.3.3
    - pandas >=2.3.3
    - py7zr >=1.0.0
    - scikit-learn >=1.7.2
    - shapely >=2.1.2
    - xarray >=2025.10.1
    - netcdf4 >=1.7.4
    - pyarrow >=24.0.0
    - pytables >=3.11.1
    - contextily >=1.7.0
    - matplotlib-base >=3.10.8
    - xyzservices >=2026.3.0
    - osbng >=0.5.1

test:
  imports:
    - caf.cvt
  commands:
    - pip check
    - caf.cvt --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/transport-for-the-north/caf.cvt
  summary: Climate Vulnerability Tool to assess the vulnerability of the transport network in the North to climate hazards.
  doc_url: http://cafcvt.readthedocs.io/
  dev_url: https://github.com/transport-for-the-north/caf.cvt
  license: LicenseRef-TfN-License
  license_file: LICENSE

extra:
  recipe-maintainers:
    - DanielJacksonTfN
    - MattBuckley-TfN
    - BenTaylor-TfN
    - isaac-tfn
